name: Idea / 功能建议
description: 提议外观或使用体验的改进
title: "[Idea] "
body:
  - type: textarea
    id: need
    attributes:
      label: 使用场景 / Use case
      description: 你在做什么，哪里不顺手？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的体验 / Proposed experience
      description: 可以附参考图，请注明来源。
    validations:
      required: true
