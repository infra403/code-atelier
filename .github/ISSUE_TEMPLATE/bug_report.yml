name: Bug / 问题反馈
description: 报告可以复现的问题
title: "[Bug] "
body:
  - type: textarea
    id: environment
    attributes:
      label: 环境 / Environment
      description: 系统、VS Code 版本、扩展版本；涉及安装时补充 Node 版本。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤 / Steps to reproduce
      description: 尽量使用 examples/studio-guide。请勿粘贴令牌、私人文件或个人目录路径。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期和实际结果 / Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: 截图或日志 / Screenshots or logs
      description: 可选；请先移除个人信息。
